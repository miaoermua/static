<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --accent: #1abc9c;
  --accent-dark: #0e8c6f;
}

html, body { height: 100%; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #e8eef5 0%, #dfe8f1 55%, #d5e2ec 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.container {
  position: relative;
  width: min(1000px, 94vw);
  height: min(600px, 80vh);
  background: #f5f5f5;
  border-radius: 20px;
  box-shadow: 0 30px 60px rgba(70, 90, 110, .28);
  overflow: hidden;
}

/* ---------- 轮播卡片 ---------- */

.container .slide .item {
  position: absolute;
  top: 50%;
  transform: translate(0, -50%);
  width: 20%;
  height: 50%;
  background-position: 50% 50%;
  background-size: cover;
  border-radius: 14px;
  box-shadow: 0 18px 36px rgba(40, 50, 60, .35);
  transition: .5s;
  overflow: hidden;
}

/* 前两张铺满作为当前主图 */
.slide .item:nth-child(1),
.slide .item:nth-child(2) {
  top: 0;
  left: 0;
  transform: translate(0, 0);
  width: 100%;
  height: 100%;
  border-radius: 20px;
}

.slide .item:nth-child(3) { left: 50%; }
.slide .item:nth-child(4) { left: calc(50% + 22%); }
.slide .item:nth-child(5) { left: calc(50% + 44%); }

/* here n = 0, 1, 2, 3,... */
.slide .item:nth-child(n + 6) {
  left: calc(50% + 66%);
  opacity: 0;
}

/* 主图上的渐变遮罩，保证文字可读 */
.slide .item::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0, 0, 0, .5) 0%, rgba(0, 0, 0, .18) 45%, rgba(0, 0, 0, 0) 72%);
  opacity: 0;
  transition: opacity .5s;
  pointer-events: none;
}

.slide .item:nth-child(2)::after { opacity: 1; }

/* ---------- 文字内容 ---------- */

.item .content {
  position: absolute;
  top: 50%;
  left: 6%;
  right: 6%;
  max-width: 420px;
  text-align: left;
  color: #fff;
  transform: translate(0, -50%);
  z-index: 2;
  display: none;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .45);
}

.slide .item:nth-child(2) .content { display: block; }

.content .name {
  font-size: clamp(26px, 4vw, 42px);
  font-weight: bold;
  letter-spacing: 2px;
  opacity: 0;
  animation: animate 1s ease-in-out 1 forwards;
}

.content .des {
  margin-top: 10px;
  margin-bottom: 22px;
  font-size: 15px;
  opacity: 0;
  animation: animate 1s ease-in-out .3s 1 forwards;
}

@keyframes animate {
  from {
    opacity: 0;
    transform: translate(0, 60px);
    filter: blur(12px);
  }
  to {
    opacity: 1;
    transform: translate(0);
    filter: blur(0);
  }
}

.btn-see-more {
  display: inline-block;
  padding: 9px 20px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  text-decoration: none;
  border-radius: 999px;
  opacity: 0;
  animation: animate 1s ease-in-out .6s 1 forwards;
  transition: background .25s;
}

.btn-see-more:hover { background: var(--accent-dark); }

/* ---------- CDN 状态徽章 ---------- */

.status-row {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 10;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.status {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 15px;
  background: rgba(15, 22, 28, .55);
  color: #fff;
  font-size: 13px;
  letter-spacing: .4px;
  border-radius: 999px;
  backdrop-filter: blur(8px);
}

.status .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #f1c40f; /* 检测中 */
  box-shadow: 0 0 6px rgba(241, 196, 15, .9);
  transition: background .3s, box-shadow .3s;
}

.status .dot.ok   { background: #2ecc71; box-shadow: 0 0 6px rgba(46, 204, 113, .9); }
.status .dot.warn { background: #f39c12; box-shadow: 0 0 6px rgba(243, 156, 18, .9); }
.status .dot.err  { background: #e74c3c; box-shadow: 0 0 6px rgba(231, 76, 60, .9); }

/* ---------- 紧急联系气泡 ---------- */

.contact { position: relative; }

.contact-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 15px;
  background: rgba(15, 22, 28, .55);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  letter-spacing: .4px;
  border: none;
  border-radius: 999px;
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: background .25s;
}

.contact-btn:hover { background: rgba(15, 22, 28, .78); }
.contact-btn svg { width: 14px; height: 14px; }

.contact-pop {
  position: absolute;
  top: calc(100% + 10px);
  left: 0;
  width: 300px;
  padding: 16px;
  background: rgba(15, 22, 28, .85);
  color: #fff;
  border-radius: 14px;
  backdrop-filter: blur(12px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity .25s, transform .25s;
}

.contact-pop.open {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.contact-pop h3 {
  font-size: 14px;
  margin-bottom: 6px;
}

.contact-pop p {
  font-size: 12px;
  color: rgba(255, 255, 255, .72);
  line-height: 1.6;
}

.contact-pop a {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 8px;
  padding: 9px 12px;
  background: rgba(255, 255, 255, .1);
  color: #fff;
  font-size: 13px;
  text-decoration: none;
  border-radius: 9px;
  transition: background .2s;
  word-break: break-all;
}

.contact-pop a:hover { background: rgba(255, 255, 255, .22); }
.contact-pop a svg { width: 15px; height: 15px; flex-shrink: 0; }
.contact-pop a .tag { margin-left: auto; padding-left: 8px; font-size: 11px; color: rgba(255, 255, 255, .55); white-space: nowrap; }

/* ---------- 前进 / 后退按钮 ---------- */

.nav {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  gap: 12px;
}

.nav button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .55);
  background: rgba(255, 255, 255, .22);
  color: #fff;
  backdrop-filter: blur(6px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .25s, transform .25s;
}

.nav button:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(1.08);
}

.nav svg { width: 18px; height: 18px; }

.credit {

  right: 18px;

  z-index: 10;
  font-size: 12px;

  text-shadow: 0 1px 4px rgba(0, 0, 0, .45);
}

.credit a { color: inherit; text-decoration: none; }
.credit a:hover { text-decoration: underline; }

/* ---------- 移动端 ---------- */

@media (max-width: 760px) {
  body { overflow: auto; }

  .container {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
  }

  .slide .item {
    width: 100%;
    height: 100%;
    left: 0 !important;
    border-radius: 0;
    opacity: 0;
    pointer-events: none;
  }

  .slide .item:nth-child(1),
  .slide .item:nth-child(2) {
    opacity: 1;
    pointer-events: auto;
    border-radius: 0;
  }

  .item .content { left: 24px; right: 24px; }

  .nav { bottom: 26px; }
  .credit { bottom: 36px; }
}

<script type="text/javascript">
  // ---------- 轮播 ----------
  const container = document.querySelector('.container');
  const slide = document.querySelector('.slide');

  function goNext() { slide.appendChild(slide.firstElementChild); }
  function goPrev() { slide.prepend(slide.lastElementChild); }

  let timer = setInterval(goNext, 5000);
  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(goNext, 5000);
  }

  document.querySelector('.next').addEventListener('click', () => { goNext(); restartTimer(); });
  document.querySelector('.prev').addEventListener('click', () => { goPrev(); restartTimer(); });

  // 键盘方向键
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { goNext(); restartTimer(); }
    if (e.key === 'ArrowLeft')  { goPrev(); restartTimer(); }
  });

  // 鼠标悬停时暂停自动播放
  container.addEventListener('mouseenter', () => clearInterval(timer));
  container.addEventListener('mouseleave', restartTimer);

  // ---------- 紧急联系气泡 ----------
  const contactBtn = document.getElementById('contactBtn');
  const contactPop = document.getElementById('contactPop');

  contactBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = contactPop.classList.toggle('open');
    contactBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  document.addEventListener('click', (e) => {
    if (!contactPop.contains(e.target)) {
      contactPop.classList.remove('open');
      contactBtn.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      contactPop.classList.remove('open');
      contactBtn.setAttribute('aria-expanded', 'false');
    }
  });

  // ---------- CDN 加载状态检测 ----------
  // 对每张图片发起一次带时间戳参数的请求，绕过浏览器缓存，真实反映 CDN 可用性与耗时
  (function checkCdn() {
    const items = [...document.querySelectorAll('.item')];
    const urls = items
      .map(el => (el.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/) || [])[1])
      .filter(Boolean);

    const total = urls.length;
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    let ok = 0, fail = 0;
    const times = [];

    function settle() {
      if (ok + fail < total) return;
      if (fail === 0 && ok > 0) {
        const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
        dot.className = 'dot ok';
        text.textContent = ok + '/' + total + ' 张图片加载成功 · 平均 ' + avg + ' ms';
      } else if (ok > 0) {
        dot.className = 'dot warn';
        text.textContent = ok + '/' + total + ' 张加载成功，' + fail + ' 张失败';
      } else {
        dot.className = 'dot err';
        text.textContent = '全部图片加载失败，CDN 异常';
      }
    }

    urls.forEach(u => {
      const t0 = performance.now();
      const im = new Image();
      im.onload = () => { ok++; times.push(performance.now() - t0); settle(); };
      im.onerror = () => { fail++; settle(); };
      im.src = u + (u.includes('?') ? '&' : '?') + 'cdncheck=' + Date.now();
    });
  })();
</script>
